[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitak-rag"
version = "0.1.0"
description = "Deterministic graph-grounded vitamin K question answering prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "kuzu>=0.8,<1",
  "chromadb>=1.0,<2",
  "jieba>=0.42,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "lxml>=5,<7",
  "beautifulsoup4>=4.12,<5",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
vitak = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
